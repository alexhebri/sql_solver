<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SQL Solver</title>
    <style>
      :root {
        --bg: oklch(15% 0.015 165);
        --panel: oklch(20% 0.018 165);
        --panel-2: oklch(24% 0.018 165);
        --text: oklch(92% 0.015 165);
        --muted: oklch(72% 0.02 165);
        --accent: oklch(78% 0.13 155);
        --error: oklch(72% 0.16 25);
        --border: oklch(34% 0.025 165);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        width: 360px;
      }

      .wrap { padding: 16px 16px 14px; }

      h1 {
        font-size: 16px;
        margin: 0 0 12px;
        letter-spacing: 0.3px;
      }

      .field { margin-bottom: 12px; }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input[type="password"],
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
      }

      textarea {
        resize: vertical;
        min-height: 110px;
        max-height: 200px;
        line-height: 1.4;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        background: var(--accent);
        color: oklch(18% 0.02 165);
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .schema-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .schema-controls button {
        width: auto;
        padding: 8px 10px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 12px;
      }

      .schema-controls button:disabled {
        display: none;
      }

      .schema-name {
        min-width: 0;
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.45;
      }

      .status strong { color: var(--accent); }

      .error { color: var(--error); }

      .output {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: oklch(12% 0.015 165);
        border: 1px dashed var(--border);
        color: var(--text);
        font-size: 12px;
        min-height: 48px;
        white-space: pre-wrap;
      }

      .tip {
        margin-top: 10px;
        font-size: 10px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>SQL Solver</h1>

      <div class="field">
        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." />
      </div>

      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" value="deepseek/deepseek-v4-flash" />
      </div>

      <div class="field">
        <label for="userInput">Cerinta sau SQL</label>
        <textarea id="userInput" placeholder="Scrie cerinta in limbaj natural sau lipeste un query SQL..."></textarea>
      </div>

      <div class="field" role="group" aria-labelledby="schemaLabel">
        <label id="schemaLabel">Database schema</label>
        <div class="schema-controls">
          <button id="loadSchemaBtn" type="button">Load SQL schema</button>
          <input id="schemaFileInput" type="file" accept=".sql,text/plain" hidden />
          <button id="resetSchemaBtn" type="button" disabled>Use bundled schema</button>
          <span id="schemaName" class="schema-name" aria-live="polite">Loading bundled schema…</span>
        </div>
      </div>

      <button id="runBtn">Generate / Improve</button>

      <div class="status" id="statusArea" role="status" aria-live="polite">
        <div><strong>Detected:</strong> <span id="modePreview">-</span></div>
        <div><strong>Status:</strong> <span id="statusText">Idle</span></div>
      </div>

      <div class="output" id="outputArea"></div>

      <div class="tip">
        Your selected schema is saved in this browser and included with each request.
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
